<div class="page container">
  <header class="page-header">
    <h1 class="page-title">Let's <span class="gradient-text">connect</span></h1>
    <p class="page-sub">Looking forward to hearing from you. Reach out about roles, projects or a quick chat.</p>
  </header>

  <div class="row g-4 justify-content-center">
    <div class="col-md-6 col-lg-4" *ngFor="let c of channels">
      <a class="glass-card channel" [href]="c.href" [attr.target]="c.external ? '_blank' : null" rel="noopener">
        <span class="icon"><i [class]="c.icon"></i></span>
        <h3>{{ c.label }}</h3>
        <p>{{ c.value }}</p>
      </a>
    </div>
  </div>

  <div class="text-center mt-5">
    <a class="cta" href="mailto:varun.nallamothu@outlook.com">Say hello <i class="fa fa-arrow-right"></i></a>
  </div>

  <div class="map glass-card mt-5">
    <iframe
      title="Kingston, Ontario, Canada map"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d365260.1513222927!2d-77.06408657434802!3d44.3388282787257!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cd2ab0674408ea9%3A0x76a5497715d6d9ea!2sKingston%2C%20ON%2C%20Canada!5e0!3m2!1sen!2sin!4v1690989786968!5m2!1sen!2sin"
      width="100%" height="380" allowfullscreen="" loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
</div>
